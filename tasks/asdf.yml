- name: Resolve asdf binary (Homebrew prefix)
  ansible.builtin.set_fact:
    asdf_bin: /home/linuxbrew/.linuxbrew/bin/asdf

- name: Configure asdf nodejs (plugin, install, set global)
  block:
    - name: List installed asdf plugins
      ansible.builtin.command: "{{ asdf_bin }} plugin list"
      register: asdf_plugin_list
      changed_when: false

    - name: Add asdf nodejs plugin
      ansible.builtin.command:
        cmd: "{{ asdf_bin }} plugin add nodejs https://github.com/asdf-vm/asdf-nodejs.git"
      when: "'nodejs' not in asdf_plugin_list.stdout_lines"

    - name: Install latest LTS nodejs via asdf
      ansible.builtin.command: "{{ asdf_bin }} install nodejs lts"

    - name: Set nodejs LTS as global asdf version
      ansible.builtin.shell: |
        {{ asdf_bin }} set -u nodejs lts 2>/dev/null || {{ asdf_bin }} global nodejs lts
      changed_when: false
  environment:
    PATH: /home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}

- name: Configure asdf lua (plugin, install, set global)
  block:
    - name: List installed asdf plugins
      ansible.builtin.command: "{{ asdf_bin }} plugin list"
      register: asdf_plugin_list_lua
      changed_when: false

    - name: Add asdf lua plugin
      ansible.builtin.command:
        cmd: "{{ asdf_bin }} plugin add lua https://github.com/Stratus3D/asdf-lua.git"
      when: "'lua' not in asdf_plugin_list_lua.stdout_lines"

    - name: Install latest Lua 5.4 via asdf
      ansible.builtin.command: "{{ asdf_bin }} install lua latest:5.4"
      environment:
        ASDF_LUA_LINUX_READLINE: "1"

    - name: Set Lua 5.4 as global asdf version
      ansible.builtin.shell: |
        {{ asdf_bin }} set -u lua latest:5.4 2>/dev/null || {{ asdf_bin }} global lua latest:5.4
      changed_when: false
  environment:
    PATH: /home/linuxbrew/.linuxbrew/bin:{{ ansible_facts.env.PATH }}
