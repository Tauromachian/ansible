- name: Verify WSL profile requirements
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      The 'wsl' profile is only supported on Debian-based distributions
      (detected: {{ ansible_facts['os_family'] }}).
  tags: wsl

- name: Install WSL packages
  become: true
  ansible.builtin.apt:
    name: "{{ wsl_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: wsl

- name: Install desktop packages (Debian)
  become: true
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: [home, work]

- name: Install desktop packages (Arch)
  become: true
  community.general.pacman:
    name: "{{ desktop_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Archlinux'
  tags: [home, work]
