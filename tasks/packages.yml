- name: Install desktop packages (Debian)
  become: true
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install desktop packages (Arch)
  become: true
  community.general.pacman:
    name: "{{ desktop_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Archlinux'
