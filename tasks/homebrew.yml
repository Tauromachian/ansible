- name: Ensure Homebrew dependencies are installed
  ansible.builtin.package:
    name: "{{ homebrew_dependencies }}"
  become: true

- name: Install packages available in official repositories (Arch)
  become: true
  community.general.pacman:
    name: "{{ native_brew_alternatives }}"
    state: present
  when: ansible_os_family == 'Archlinux'

- name: Check if Homebrew is already installed
  ansible.builtin.stat:
    path: "/home/linuxbrew/.linuxbrew/bin/brew"
  register: brew_stat

- block:
  - name: Create Homebrew directory
    ansible.builtin.file:
      path: "/home/linuxbrew/.linuxbrew"
      state: directory
      owner: "{{ ansible_env.USER }}"
      group: "{{ ansible_env.USER }}"
      mode: '0755'
    become: true

  - name: Install Homebrew
    ansible.builtin.shell: |
      curl -fsSL https://github.com/Homebrew/brew/tarball/master | tar xz --strip 1 -C /home/linuxbrew/.linuxbrew

  - name: Trust workmux Homebrew formula
    ansible.builtin.command:
      cmd: brew trust --formula raine/workmux/workmux
    environment:
      PATH: /home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}

  - name: Add workmux Homebrew tap
    community.general.homebrew_tap:
      name: raine/workmux
      state: present

  - name: Install Homebrew packages
    community.general.homebrew:
      name: "{{ brew_packages }}"
      update_homebrew: true

  when: not brew_stat.stat.exists
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}"
