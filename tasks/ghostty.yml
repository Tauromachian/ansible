- name: Download and install Ghostty GPG key (dearmored)
  become: true
  shell: |
    curl -sS https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc | gpg --dearmor -o /etc/apt/trusted.gpg.d/debian.griffo.io.gpg -
  args:
    creates: /etc/apt/trusted.gpg.d/debian.griffo.io.gpg
  register: gpg_key_result
  changed_when: gpg_key_result.rc == 0

- name: Add Ghostty repository
  become: true
  apt_repository:
    repo: "deb https://debian.griffo.io/apt trixie main"
    filename: debian.griffo.io
    state: present

- name: Update cache
  become: true
  apt:
    update_cache: yes

- name: Install Ghostty
  become: true
  ansible.builtin.apt:
    name:
      - ghostty
