- name: Ensure keyrings directory exists
  become: true
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Ghostty key
  become: true
  get_url:
    url: https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc
    dest: /tmp/ghostty.asc
    mode: "0644"

- name: Dearmor Ghostty key
  become: true
  command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - -o
      - /etc/apt/keyrings/ghostty.gpg
      - /tmp/ghostty.asc
  args:
    creates: /etc/apt/keyrings/ghostty.gpg

- name: Add Ghostty repository
  become: true
  apt_repository:
    repo: "deb https://debian.griffo.io/apt trixie main"
    filename: debian.griffo.io
    state: present

- name: Update cache
  become: true
  apt:
    update_cache: yes

- name: Install Ghostty
  become: true
  ansible.builtin.apt:
    name:
      - ghostty
